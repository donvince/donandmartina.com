name: Update allowed emails

on:
  workflow_call:
    secrets:
      ALLOWED_EMAILS:
        required: true
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  access-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::015311074066:role/projects/donandmartina/donandmartina-ci
          role-session-name: donandmartina-allowed-emails
          aws-region: us-east-1

      - name: Validate AWS authentication guardrails
        run: infra/scripts/validate-aws-auth.sh

      - name: Normalize and validate allowed emails
        env:
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
        run: |
          node --test infra/scripts/normalize-allowed-emails.test.js
          NORMALIZED=$(node infra/scripts/normalize-allowed-emails.js)
          echo "::add-mask::$NORMALIZED"
          echo "ALLOWED_EMAILS_NORMALIZED=$NORMALIZED" >> "$GITHUB_ENV"

      - name: Deploy access configuration stack
        run: |
          aws cloudformation deploy \
            --template-file infra/access-config.yaml \
            --stack-name donandmartina-access-config \
            --no-fail-on-empty-changeset \
            --region us-east-1 \
            --parameter-overrides AllowedEmails="$ALLOWED_EMAILS_NORMALIZED"
