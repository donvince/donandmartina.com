name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# CloudFormation can keep updating the site stack after a runner has stopped,
# especially while old Lambda@Edge replicas drain. Queue full deployments so
# a newer push cannot race the active stack update. Do not cancel the active
# run: cancelling GitHub Actions does not cancel CloudFormation.
concurrency:
  group: donandmartina-site-deploy
  cancel-in-progress: false

env:
  # Must be in us-east-1: Lambda fetches the zip using the function's own
  # region, and both Lambdas here (Cognito allow-list, Lambda@Edge auth) are
  # us-east-1. A cross-region bucket fails with GetObjectVersion
  # TemporaryRedirect.
  ARTIFACTS_BUCKET: donandmartina-lambda-artifacts-us-east-1-015311074066

jobs:
  validate-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate AWS authentication guardrails
        run: infra/scripts/validate-aws-auth.sh --offline

  # Create the allow-list parameter before publishing a Lambda that reads it.
  # The called workflow can also be dispatched directly for list-only changes.
  access-config:
    needs: validate-auth
    uses: ./.github/workflows/update-allowed-emails.yml
    secrets:
      ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}

  # Deploy the Lambda artifacts bucket. Runs independently; subsequent jobs
  # assume the bucket exists before uploading zips.
  artifacts:
    needs: validate-auth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::015311074066:role/projects/donandmartina/donandmartina-ci
          role-session-name: donandmartina-artifacts
          aws-region: us-east-1

      - name: Deploy artifacts stack
        run: |
          aws cloudformation deploy \
            --template-file infra/artifacts.yaml \
            --stack-name donandmartina-artifacts \
            --no-fail-on-empty-changeset \
            --region us-east-1

  # Deploy the Cognito user pool (Google IdP + Cognito allow-list Lambda).
  # Runs BEFORE the site stack because the auth-edge Lambda's config.js is
  # built from this stack's outputs (user pool id, app client id/secret,
  # hosted UI domain) — deploying them as one stack would be circular.
  cognito:
    needs: [access-config, artifacts]
    runs-on: ubuntu-latest
    outputs:
      user_pool_id: ${{ steps.outputs.outputs.user_pool_id }}
      app_client_id: ${{ steps.outputs.outputs.app_client_id }}
      app_client_secret: ${{ steps.outputs.outputs.app_client_secret }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::015311074066:role/projects/donandmartina/donandmartina-ci
          role-session-name: donandmartina-cognito
          aws-region: us-east-1

      - name: Bundle Cognito allow-list Lambda
        working-directory: infra/lambda/cognito-allow-list
        run: |
          npm ci --omit=dev
          zip -r ../../../cognito-allow-list.zip . -x '*.test.js' 'tests/*'

      - name: Upload Cognito allow-list zip
        id: upload_cognito_allow_list
        run: |
          aws s3 cp cognito-allow-list.zip "s3://${ARTIFACTS_BUCKET}/cognito-allow-list.zip" --region us-east-1
          VERSION_ID=$(aws s3api head-object --bucket "${ARTIFACTS_BUCKET}" --key cognito-allow-list.zip --region us-east-1 --query VersionId --output text)
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy Cognito stack
        run: |
          aws cloudformation deploy \
            --template-file infra/cognito.yaml \
            --stack-name donandmartina-cognito \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region us-east-1 \
            --parameter-overrides \
              GoogleClientId="${{ secrets.GOOGLE_CLIENT_ID }}" \
              GoogleClientSecret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              CognitoDomainPrefix="${{ secrets.COGNITO_DOMAIN_PREFIX }}" \
              CognitoAllowListLambdaS3Bucket="${ARTIFACTS_BUCKET}" \
              CognitoAllowListLambdaS3ObjectVersion="${{ steps.upload_cognito_allow_list.outputs.version_id }}"

      - name: Read Cognito stack outputs
        id: outputs
        run: |
          OUT=$(aws cloudformation describe-stacks --stack-name donandmartina-cognito --region us-east-1 --query "Stacks[0].Outputs" --output json)
          {
            echo "user_pool_id=$(echo "$OUT" | jq -r '.[] | select(.OutputKey=="UserPoolId") | .OutputValue')"
            echo "app_client_id=$(echo "$OUT" | jq -r '.[] | select(.OutputKey=="UserPoolClientId") | .OutputValue')"
          } >> "$GITHUB_OUTPUT"
          {
            echo "app_client_secret<<EOF_SECRET"
            echo "$OUT" | jq -r '.[] | select(.OutputKey=="UserPoolClientSecret") | .OutputValue'
            echo "EOF_SECRET"
          } >> "$GITHUB_OUTPUT"

  # Deploy the CloudFront + ACM + DNS + auth-edge Lambda@Edge stack.
  infra:
    needs: cognito
    runs-on: ubuntu-latest
    outputs:
      distribution_id: ${{ steps.outputs.outputs.distribution_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::015311074066:role/projects/donandmartina/donandmartina-ci
          role-session-name: donandmartina-infra
          aws-region: us-east-1

      - name: Wait for site stack to become updateable
        run: |
          for attempt in $(seq 1 80); do
            set +e
            STACK_OUTPUT=$(aws cloudformation describe-stacks \
              --stack-name donandmartina-site \
              --region us-east-1 \
              --query 'Stacks[0].StackStatus' \
              --output text 2>&1)
            DESCRIBE_EXIT=$?
            set -e

            if [ "$DESCRIBE_EXIT" -ne 0 ]; then
              if echo "$STACK_OUTPUT" | grep -q 'does not exist'; then
                echo "Site stack does not exist yet; CloudFormation can create it."
                break
              fi

              echo "$STACK_OUTPUT" >&2
              exit "$DESCRIBE_EXIT"
            fi

            case "$STACK_OUTPUT" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE|IMPORT_ROLLBACK_COMPLETE)
                echo "Site stack is updateable: $STACK_OUTPUT"
                break
                ;;
              *_IN_PROGRESS)
                if [ "$attempt" -eq 80 ]; then
                  echo "Timed out after 20 minutes waiting for site stack; current status: $STACK_OUTPUT" >&2
                  exit 1
                fi
                echo "Site stack is $STACK_OUTPUT; waiting 15 seconds ($attempt/80)."
                sleep 15
                ;;
              *)
                echo "Site stack is not updateable: $STACK_OUTPUT" >&2
                exit 1
                ;;
            esac
          done

      - name: Generate auth-edge Lambda config
        env:
          USER_POOL_ID: ${{ needs.cognito.outputs.user_pool_id }}
          APP_CLIENT_ID: ${{ needs.cognito.outputs.app_client_id }}
          APP_CLIENT_SECRET: ${{ needs.cognito.outputs.app_client_secret }}
          # Built directly from the secret rather than passed through
          # needs.cognito.outputs: a value that is itself a substring of a
          # secret (COGNITO_DOMAIN_PREFIX) is unreliable crossing a job
          # boundary — GitHub's secret masking silently emptied it there,
          # even though the cognito job's own step extracted it correctly.
          COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN_PREFIX }}.auth.us-east-1.amazoncognito.com
        run: |
          cat > infra/lambda/auth/config.js <<EOF
          'use strict';
          module.exports = {
            cognitoRegion: 'us-east-1',
            userPoolId: '${USER_POOL_ID}',
            appClientId: '${APP_CLIENT_ID}',
            appClientSecret: '${APP_CLIENT_SECRET}',
            cognitoDomain: '${COGNITO_DOMAIN}',
            callbackUrl: 'https://donandmartina.com/callback',
          };
          EOF

      - name: Bundle auth-edge Lambda
        working-directory: infra/lambda/auth
        run: |
          npm ci --omit=dev
          zip -r ../../../auth-edge.zip . -x '*.test.js' 'tests/*' 'config.example.js'

      - name: Upload auth-edge zip
        id: upload_auth
        run: |
          aws s3 cp auth-edge.zip "s3://${ARTIFACTS_BUCKET}/auth-edge.zip" --region us-east-1
          VERSION_ID=$(aws s3api head-object --bucket "${ARTIFACTS_BUCKET}" --key auth-edge.zip --region us-east-1 --query VersionId --output text)
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy site stack
        run: |
          aws cloudformation deploy \
            --template-file infra/template.yaml \
            --stack-name donandmartina-site \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region us-east-1 \
            --parameter-overrides \
              AuthEdgeLambdaS3Bucket="${ARTIFACTS_BUCKET}" \
              AuthEdgeLambdaS3ObjectVersion="${{ steps.upload_auth.outputs.version_id }}"

      - name: Read stack outputs
        id: outputs
        run: |
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name donandmartina-site \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          echo "distribution_id=$DIST_ID" >> "$GITHUB_OUTPUT"
          echo "CloudFront distribution: $DIST_ID"

  # Build the Hugo site and publish it to the origin bucket, then invalidate
  # the CDN. Depends on infra so the distribution id is available.
  deploy:
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Build site
        run: hugo --minify --baseURL "https://donandmartina.com/"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::015311074066:role/projects/donandmartina/donandmartina-ci
          role-session-name: donandmartina-site
          aws-region: eu-west-1

      - name: Sync to S3
        run: aws s3 sync public/ s3://donandmartina.com --delete --cache-control "public,max-age=3600"

      - name: Invalidate CloudFront
        env:
          DIST_ID: ${{ needs.infra.outputs.distribution_id }}
        run: |
          if [ -n "$DIST_ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          else
            echo "no distribution id resolved, skipping"
          fi
