<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3eb" />
    <meta name="description" content="Our shared grocery list." />
    <title>Groceries</title>
    <link rel="stylesheet" href="/shopping/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <h1 class="visually-hidden">Groceries</h1>
      <button
        id="openAllowListButton"
        class="icon-button menu-button"
        type="button"
        aria-label="Manage favourites"
        aria-haspopup="dialog"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 6h16M4 12h16M4 18h10" />
          <circle cx="18" cy="18" r="2" />
        </svg>
      </button>

      <p id="syncStatus" class="sync-status" role="status" aria-live="polite">Loading your list…</p>

      <section class="list-panel" aria-labelledby="listTitle">
        <h2 id="listTitle" class="visually-hidden">Your groceries</h2>
        <p id="emptyList" class="empty-list">Add something below to start your list.</p>
        <ul id="shoppingList" class="shopping-list" aria-live="polite"></ul>
      </section>

      <div class="composer-wrap">
        <div id="recognitionPreview" class="recognition-preview" aria-live="polite" aria-label="Recognition result" hidden></div>
        <div id="inputFeedback" class="input-feedback" role="status" aria-live="polite" hidden></div>
        <p id="listeningStatus" class="listening-status" aria-live="polite" hidden>
          <span class="listening-status__dot" aria-hidden="true"></span>
          Listening <span id="interimTranscript"></span>
        </p>
        <form id="composerForm" class="composer">
          <label class="visually-hidden" for="messageInput">Groceries to add</label>
          <input
            id="messageInput"
            name="message"
            type="text"
            autocomplete="off"
            enterkeyhint="send"
            placeholder="Add milk, bread…"
          />
          <button
            id="micButton"
            class="composer__button mic-button"
            type="button"
            aria-label="Start voice input"
            aria-pressed="false"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <rect x="9" y="3" width="6" height="11" rx="3" />
              <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6" />
            </svg>
          </button>
          <button id="sendButton" class="composer__button send-button" type="submit" aria-label="Add groceries">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m5 12 14-7-4.5 14-2.7-5.2L5 12Z" />
              <path d="m11.8 13.8 3.7-3.7" />
            </svg>
          </button>
        </form>
        <p id="modelStatus" class="model-status" role="status" aria-live="polite">
          <span class="model-status__dot" aria-hidden="true"></span>
          <span id="modelStatusText">Loading grocery model…</span>
        </p>
      </div>
    </main>

    <dialog id="allowListDialog" class="allow-list-dialog" aria-labelledby="allowListTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <header class="sheet-header">
        <div>
          <p class="section-label">Quick lookup</p>
          <h2 id="allowListTitle">Favourites</h2>
        </div>
        <button id="closeAllowListButton" class="icon-button" type="button" aria-label="Close favourites">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </header>
      <p class="sheet-intro">
        Groceries and shorthand you use most.
      </p>

      <form id="allowListForm" class="allow-list-form">
        <label for="allowItemInput">Add favourite</label>
        <div>
          <input id="allowItemInput" name="allowedItem" type="text" autocomplete="off" placeholder="e.g. tomatoes" />
          <button id="addFavouriteButton" class="primary-button" type="submit" disabled>Add</button>
        </div>
        <p id="allowListError" class="allow-list-form__error" role="alert" hidden></p>
      </form>

      <div class="allowed-items-wrap">
        <ul id="allowListItems" class="allowed-items" aria-label="Favourite groceries"></ul>
      </div>

      <footer class="sheet-footer">
        <button id="resetAllowListButton" class="danger-button" type="button">Reset favourites</button>
      </footer>
    </dialog>

    <div id="itemMenu" class="item-menu" role="menu" hidden>
      <button id="itemMenuDone" class="item-menu__option item-menu__option--done" type="button" role="menuitem">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg>
        <span id="itemMenuDoneLabel">Got it</span>
      </button>
      <button id="itemMenuDelete" class="item-menu__option item-menu__option--delete" type="button" role="menuitem">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M8 7l1 13h6l1-13M10 11v5M14 11v5" /></svg>
        <span>Delete</span>
      </button>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="/shopping/app.js?v=2"></script>
  </body>
</html>
