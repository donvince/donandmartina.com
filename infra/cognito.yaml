AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  donandmartina.com Cognito user pool — Google as the sole federated IdP,
  gated by an email allow-list Cognito trigger Lambda. Deployed as a separate
  stack from the site/CloudFront stack (infra/template.yaml) because the
  site's Lambda@Edge auth handler needs this stack's outputs (user pool id,
  app client id/secret, hosted UI domain) baked into its own config at
  build time — deploying them as one stack would be circular.

Parameters:

  GoogleClientId:
    Type: String
    NoEcho: true

  GoogleClientSecret:
    Type: String
    NoEcho: true

  CognitoDomainPrefix:
    Type: String
    Default: auth-donandmartina
    Description: Prefix for the Cognito Hosted UI domain, e.g. auth-donandmartina -> auth-donandmartina.auth.us-east-1.amazoncognito.com

  CallbackUrl:
    Type: String
    Default: https://donandmartina.com/callback

  LogoutUrl:
    Type: String
    Default: https://donandmartina.com/

  CognitoAllowListLambdaS3Bucket:
    Type: String
    Description: Artifacts bucket holding the Cognito allow-list Lambda zip.

  CognitoAllowListLambdaS3Key:
    Type: String
    Default: cognito-allow-list.zip

  CognitoAllowListLambdaS3ObjectVersion:
    Type: String
    Description: >-
      S3 object version id of the zip above. The artifacts bucket has
      versioning enabled; passing the version id (rather than relying on the
      key alone) is what makes CloudFormation detect and deploy code changes
      on a fixed key name.

Resources:

  CognitoAllowListLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: donandmartina-cognito-allow-list-role
      PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/ProjectWorkloadBoundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadAllowedEmailsParameter
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  Fn::ImportValue: donandmartina-access-config-AllowedEmailsParameterArn

  CognitoAllowListLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: donandmartina-cognito-allow-list
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt CognitoAllowListLambdaRole.Arn
      Timeout: 10
      Environment:
        Variables:
          ALLOWED_EMAILS_PARAMETER_NAME:
            Fn::ImportValue: donandmartina-access-config-AllowedEmailsParameterName
      Code:
        S3Bucket: !Ref CognitoAllowListLambdaS3Bucket
        S3Key: !Ref CognitoAllowListLambdaS3Key
        S3ObjectVersion: !Ref CognitoAllowListLambdaS3ObjectVersion

  CognitoAllowListLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CognitoAllowListLambda
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: donandmartina-users
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      DeletionProtection: INACTIVE
      LambdaConfig:
        PreSignUp: !GetAtt CognitoAllowListLambda.Arn
        PreAuthentication: !GetAtt CognitoAllowListLambda.Arn

  UserPoolGoogleIdP:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref CognitoDomainPrefix

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: UserPoolGoogleIdP
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: donandmartina-site
      GenerateSecret: true
      SupportedIdentityProviders:
        - Google
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - !Ref CallbackUrl
      LogoutURLs:
        - !Ref LogoutUrl
      ExplicitAuthFlows: []

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  UserPoolClientSecret:
    Value: !GetAtt UserPoolClient.ClientSecret
  CognitoDomain:
    Value: !Sub "${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
