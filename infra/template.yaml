AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  donandmartina.com static site — private S3 origin served via CloudFront with
  Origin Access Control (OAC), an ACM certificate, and a Lambda@Edge Google
  OAuth gate backed by Cognito (see infra/cognito.yaml, deployed separately).

# ─────────────────────────────────────────────────────────────────────────────
# DEPLOYMENT NOTES (READ BEFORE DEPLOYING)
#
# * This stack must be deployed to us-east-1: the ACM certificate for CloudFront
#   and the later Lambda@Edge function both have to live in us-east-1. The origin
#   S3 bucket lives in eu-west-1, which is fine — it is referenced by its regional
#   domain name.
#
# * This account (015311074066) ALREADY HAS the Route 53 hosted zone and both S3
#   buckets. This template therefore does NOT create the hosted zone or the
#   buckets — it references them by id/name (see Parameters) and manages only the
#   apex bucket's BucketPolicy (a policy can be attached to a pre-existing bucket
#   without a CloudFormation resource import).
#
# * The apex bucket currently allows public static-website access. CloudFormation
#   CANNOT flip an un-imported bucket's Public Access Block or turn off website
#   hosting, so those must be done ONCE out-of-band before/after this stack. Exact
#   commands (do NOT run from this template):
#
#     aws s3api put-public-access-block \
#       --bucket donandmartina.com \
#       --public-access-block-configuration \
#         BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true \
#       --region eu-west-1 --profile don-donandmartina
#
#     aws s3api delete-bucket-website \
#       --bucket donandmartina.com \
#       --region eu-west-1 --profile don-donandmartina
#
# * www → apex canonical redirect: not implemented. Both aliases (apex + www)
#   serve the same CloudFront distribution / content. A future slice could add
#   this inside the Lambda@Edge auth handler (a CloudFront Function can't
#   coexist with the viewer-request Lambda@Edge association below).
#
# * DEPLOY ORDER for this slice: infra/cognito.yaml FIRST (creates the user
#   pool / app client the auth-edge Lambda's config.js is built from), THEN
#   this template. Both are deployed by the same GHA workflow, in that order.
# ─────────────────────────────────────────────────────────────────────────────

Parameters:

  DomainName:
    Type: String
    Default: donandmartina.com
    Description: Apex domain served by the distribution.

  WwwDomainName:
    Type: String
    Default: www.donandmartina.com
    Description: www subdomain (secondary alias on the same distribution).

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z3TV7VV2BXYQ1M
    Description: >-
      Id of the EXISTING donandmartina.com. hosted zone. This template does not
      create the zone — it only adds records to it.

  SiteBucketName:
    Type: String
    Default: donandmartina.com
    Description: >-
      Name of the EXISTING apex origin bucket (eu-west-1). This template does not
      create it; it only manages its BucketPolicy for CloudFront OAC access.

  # NOTE: WwwBucketName is intentionally unused in this slice (cfn-lint emits a
  # benign W2001). It is retained for the later www→apex / auth work.
  WwwBucketName:
    Type: String
    Default: www.donandmartina.com
    Description: >-
      Name of the EXISTING www bucket. Currently unused by this slice (the www
      alias is served from the same distribution/origin as the apex). Retained as
      a parameter for future use.

  SiteBucketRegion:
    Type: String
    Default: eu-west-1
    Description: Region of the apex origin bucket, used to build its regional domain name.

  AuthEdgeLambdaS3Bucket:
    Type: String
    Description: >-
      Artifacts bucket holding the auth-edge Lambda zip (built with the
      Cognito user pool / app client baked into config.js). Deploy this stack
      AFTER infra/cognito.yaml so those values exist.

  AuthEdgeLambdaS3Key:
    Type: String
    Default: auth-edge.zip

  AuthEdgeLambdaS3ObjectVersion:
    Type: String
    Description: >-
      S3 object version id of the zip above (artifacts bucket has versioning
      enabled). Required so CloudFormation redeploys on code changes despite
      the fixed key name, and so a new Lambda version is published each time
      (Lambda@Edge associations require a version, not $LATEST).

Resources:

  # ── ACM certificate (us-east-1, required for CloudFront) ────────────────────
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Ref WwwDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Ref WwwDomainName
          HostedZoneId: !Ref HostedZoneId

  # ── CloudFront Origin Access Control (OAC) ──────────────────────────────────
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${DomainName}-oac"
        Description: OAC granting CloudFront read access to the private apex bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── Auth Lambda@Edge (viewer-request: JWT check, /callback, index rewrite) ──
  # Must live in us-east-1 (this stack's region) — Lambda@Edge requirement.
  AuthEdgeLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: donandmartina-auth-edge-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - edgelambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  AuthEdgeLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: donandmartina-auth-edge
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt AuthEdgeLambdaRole.Arn
      Timeout: 5
      MemorySize: 128
      Code:
        S3Bucket: !Ref AuthEdgeLambdaS3Bucket
        S3Key: !Ref AuthEdgeLambdaS3Key
        S3ObjectVersion: !Ref AuthEdgeLambdaS3ObjectVersion

  # Lambda@Edge associations require a published version, not $LATEST.
  #
  # Description must vary with the code, or this resource looks unchanged to
  # CloudFormation and no new version is published — the function's $LATEST
  # updates while CloudFront stays pinned to the previously published version,
  # so a deploy appears to succeed but the edge keeps running the old code.
  # Referencing the S3 object version makes each new zip publish a new version.
  AuthEdgeLambdaVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref AuthEdgeLambda
      Description: !Sub "auth-edge from s3 object version ${AuthEdgeLambdaS3ObjectVersion}"

  # ── CloudFront distribution ─────────────────────────────────────────────────
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: donandmartina.com static site (private S3 origin via OAC).
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Aliases:
          - !Ref DomainName
          - !Ref WwwDomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3Origin
            # Regional domain name of the eu-west-1 apex bucket. Using the regional
            # (not global) endpoint is required for OAC + non-us-east-1 buckets.
            DomainName: !Sub "${SiteBucketName}.s3.${SiteBucketRegion}.amazonaws.com"
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          # AWS managed "CachingOptimized" cache policy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          LambdaFunctionAssociations:
            - EventType: viewer-request
              LambdaFunctionARN: !Ref AuthEdgeLambdaVersion

  # ── Apex bucket policy (bucket itself is pre-existing, not managed here) ─────
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucketName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${SiteBucketName}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # ── DNS is NOT managed here ─────────────────────────────────────────────────
  # The zone already has a live apex A-alias and a www CNAME (both → the old S3
  # website endpoint) from the pre-existing site. CloudFormation cannot adopt
  # pre-existing records, so the cutover to CloudFront is done as a deliberate,
  # out-of-band `route53 change-resource-record-sets` UPSERT batch AFTER the
  # distribution exists and content is synced (the conscious HTTP→CDN cutover).
  # Use the CloudFrontDomain output below as the alias target; CloudFront's
  # fixed alias hosted zone id is Z2FDTNDATAQYW2. The www record must switch
  # from CNAME to an A-alias in the same batch.

Outputs:
  CloudFrontDomain:
    Description: CloudFront distribution domain name.
    Value: !GetAtt CloudFrontDistribution.DomainName
  CloudFrontDistributionId:
    Description: CloudFront distribution id.
    Value: !Ref CloudFrontDistribution
  CertificateArn:
    Description: ACM certificate ARN (us-east-1).
    Value: !Ref Certificate
  SiteBucketName:
    Description: Apex origin bucket name (pre-existing).
    Value: !Ref SiteBucketName
  HostedZoneId:
    Description: Hosted zone id records were written to (pre-existing).
    Value: !Ref HostedZoneId
  AuthEdgeLambdaArn:
    Description: Auth Lambda@Edge function ARN (unversioned).
    Value: !GetAtt AuthEdgeLambda.Arn
